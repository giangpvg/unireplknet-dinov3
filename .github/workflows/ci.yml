name: CI - Lint & Test AI Model

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt -r requirements-dev.txt

      - name: Lint Code with Flake8
        run: |
          # Dừng pipeline nếu có lỗi cú pháp hoặc undefined variables
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Kiểm tra độ phức tạp và cảnh báo định dạng
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Execute Pytest Suite
        run: |
          pytest -v tests/
